version: 0.8e-a

source_tiers:
  S0: "Official primary sources: regulators, exchanges, government agencies, central banks, and issuer disclosure systems."
  S1: "Official or quasi-official market and macro data sources."
  S2: "High-trust news, research, or structured data aggregators."
  S3: "Alternative, social, or broad media signals; cannot independently escalate beyond L1."

defaults:
  timezone: America/Los_Angeles
  timeout_seconds: 20
  retries: 2
  backoff_seconds: [2, 5, 15]
  user_agent: market-intel-bot/1.0
  conservative_host_rps: 1
  enable_etag: true
  enable_last_modified: true

scoring:
  weights:
    source_score: 0.35
    price_score: 0.20
    topic_score: 0.20
    corroboration_score: 0.15
    entity_score: 0.10
  source_scores:
    S0: 1.00
    S1: 0.75
    S2: 0.55
    S3: 0.25
  alert_thresholds:
    L0: 0.35
    L1: 0.55
    L2: 0.70
    L3: 0.85

cooldowns:
  default_minutes:
    L1: 20
    L2: 10
    L3: 2
  update_bypass: true

dedup:
  exact_key: ["source_name", "canonical_url", "published_bucket", "title_hash"]
  cross_source_key: ["entity", "topic", "time_bucket_30m"]
  treat_same_source_id_as_update: true

sectors:
  - id: equities_volatility
    name: "全球权益与波动"
    description: "Global equity index, volatility, and risk-appetite monitoring for broad market stress."
    tickers: [VOO, QQQM, SPY, QQQ, VIX, VXX, UVXY]
    trigger_rules:
      keywords: ["volatility spike", "circuit breaker", "market halt", "risk-off", "drawdown"]
      price_resonance: "Equity index move >= 1.5%, VIX move >= 10%, or volatility term-structure inversion."
      escalation: "Escalate when official market data aligns with broad ETF or futures price resonance."
    poll:
      normal_seconds: 900
      event_window_seconds: 120
    sources:
      - name: "Cboe VIX historical data"
        tier: S1
        type: market_data
        api: "Cboe VIX historical data file"
        auth_required: false
        access: public
        rate_limit: "daily file; conservative fetch only"
        latency_estimate: "end_of_day"
        priority: P0
        topics: [volatility, equity_indices, risk]
        enabled: true
        mvp_enabled: true
      - name: "Exchange market status notices"
        tier: S0
        type: exchange_notice
        api: "official exchange notices"
        auth_required: false
        access: public
        rate_limit: "1 request per host per second"
        latency_estimate: "minutes"
        priority: P1
        topics: [halts, market_structure, equity_indices]
        enabled: true
        mvp_enabled: false
      - name: "GDELT global equity volatility monitor"
        tier: S3
        type: media_aggregate
        api: "GDELT"
        auth_required: false
        access: public
        rate_limit: "1 request per host per second"
        latency_estimate: "minutes"
        priority: P2
        topics: [volatility, market_stress, global_equities]
        enabled: true
        mvp_enabled: true

